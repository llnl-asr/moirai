name: CI

# moirai built on dftracer built from source with moirai's features
# (MOIRAI_DFTRACER=BUILD), then every test but the valgrind ones
# (valgrind-ci.yml), and the documentation.
'on':
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      dftracer_ref:
        description: 'dftracer git ref to build moirai on'
        type: string
        default: 'feature/generic-event-api'

# dftracer's event-type API is on its feature/generic-event-api branch
# until that is merged: build on it, then switch the default to develop.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DFTRACER_REF: ${{ inputs.dftracer_ref || 'feature/generic-event-api' }}
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-test:
    name: Build and test (GCC-${{ matrix.gcc }}, Python-${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - gcc: 12
            python: "3.10"
          - gcc: 13
            python: "3.12"
          - gcc: 14
            python: "3.13"
    env:
      CC: gcc-${{ matrix.gcc }}
      CXX: g++-${{ matrix.gcc }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} \
            libyaml-cpp-dev ninja-build pkg-config python3-dev
          cmake --version

      - name: Install Python build dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install pybind11

      - name: Configure (dftracer ${{ env.DFTRACER_REF }} with moirai's features)
        run: |
          cmake -S . -B build \
            -DMOIRAI_DFTRACER=BUILD \
            -DMOIRAI_DFTRACER_GIT_TAG="$DFTRACER_REF" \
            -DMOIRAI_ENABLE_TESTS=ON \
            -DMOIRAI_TEST_VALGRIND=OFF \
            -DMOIRAI_WARNINGS_AS_ERRORS=ON \
            -DPython_EXECUTABLE=$PWD/venv/bin/python \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build/moirai --output-on-failure -j 4

      - name: Upload test work directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: moirai-test-gcc${{ matrix.gcc }}
          path: |
            build/moirai/test/moirai_*/
            build/moirai/Testing/Temporary/LastTest.log

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build (warnings are errors)
        run: |
          pip install -r docs/requirements.txt
          sphinx-build -W -b html docs docs/_build/html
